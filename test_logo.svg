<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="1040" height="440">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;display=swap');
      .serif-mono { font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif; }
      .letter-prop { font-family: 'Cinzel', 'Trajan Pro', 'Cinzel Decorative', serif; font-size: 27px; font-weight: 700; letter-spacing: 0.36em; fill: #0a0f1d; }
    </style>
  </defs>

  <!-- NCR Monogram -->
  <g fill="#0a0f1d">
    <!-- Left vertical stem of N -->
    <path d="M 82,34 L 102,34 L 102,122 L 82,122 Z M 72,34 L 112,34 L 112,38 L 72,38 Z M 74,118 L 110,118 L 110,122 L 74,122 Z" />
    <!-- Diagonal of N -->
    <polygon points="98,34 104,34 162,120 152,120" />

    <!-- Classical Architectural Pillar (Right stem of N) -->
    <!-- Capital -->
    <rect x="150" y="28" width="28" height="3.5" rx="1" />
    <path d="M 152,31.5 Q 164,34.5 176,31.5 L 174,38 L 154,38 Z" />
    <rect x="153" y="37" width="22" height="2" />
    <!-- Fluted Shaft -->
    <rect x="155" y="39" width="18" height="72" />
    <!-- Flute inner shadow lines (creates 3D fluted stone column effect) -->
    <line x1="158" y1="40" x2="158" y2="110" stroke="#ffffff" stroke-width="1.5" />
    <line x1="161" y1="40" x2="161" y2="110" stroke="#ffffff" stroke-width="1.5" />
    <line x1="164" y1="40" x2="164" y2="110" stroke="#ffffff" stroke-width="1.5" />
    <line x1="167" y1="40" x2="167" y2="110" stroke="#ffffff" stroke-width="1.5" />
    <line x1="170" y1="40" x2="170" y2="110" stroke="#ffffff" stroke-width="1.5" />
    <!-- Pillar Base Plinth -->
    <rect x="153" y="111" width="22" height="3" />
    <path d="M 152,114 Q 164,116 176,114 L 177,118 L 151,118 Z" />
    <rect x="150" y="118" width="28" height="4" rx="1" />

    <!-- Letter C -->
    <path d="M 238,44 C 230,36 218,31 202,31 C 176,31 157,51 157,78 C 157,105 176,125 203,125 C 219,125 231,120 239,111 L 232,104 C 225,111 216,115 203,115 C 182,115 168,99 168,78 C 168,57 182,41 202,41 C 215,41 224,45 231,52 Z" />

    <!-- Letter R -->
    <!-- R vertical stem -->
    <path d="M 252,34 L 270,34 L 270,122 L 252,122 Z M 244,34 L 278,34 L 278,38 L 244,38 Z M 246,118 L 276,118 L 276,122 L 246,122 Z" />
    <!-- R upper loop -->
    <path d="M 270,34 L 298,34 C 314,34 326,43 326,56 C 326,69 314,78 298,78 L 270,78 Z M 270,42 L 270,70 L 296,70 C 307,70 314,64 314,56 C 314,48 307,42 296,42 Z" />
    <!-- R sweeping flourish leg -->
    <path d="M 288,75 L 305,75 C 314,84 324,103 336,114 C 344,121 356,122 368,122 L 368,118 C 358,118 348,116 341,109 C 329,97 318,81 308,74 L 288,74 Z" />
  </g>

  <!-- Upper Divider Line -->
  <line x1="64" y1="136" x2="376" y2="136" stroke="#0a0f1d" stroke-width="2.2" stroke-linecap="square" />

  <!-- Subtitle Text: P R O P E R T I ≡ S -->
  <!-- We render letters P R O P with SVG text, then E as 3 bars, then R T I E S -->
  <text x="64" y="166" class="letter-prop serif-mono">PROPE</text>
  <!-- Architectural 3 bars replacing standard E glyph -->
  <!-- Note: We also render the full text cleanly with tracking and custom 3 bars -->
  <g fill="#0a0f1d">
    <!-- P -->
    <text x="66" y="165" font-family="Cinzel, serif" font-size="24" font-weight="700">P</text>
    <!-- R -->
    <text x="98" y="165" font-family="Cinzel, serif" font-size="24" font-weight="700">R</text>
    <!-- O -->
    <text x="132" y="165" font-family="Cinzel, serif" font-size="24" font-weight="700">O</text>
    <!-- P -->
    <text x="168" y="165" font-family="Cinzel, serif" font-size="24" font-weight="700">P</text>
    <!-- E styled as 3 bars -->
    <rect x="201" y="147" width="18" height="3.2" rx="0.5" />
    <rect x="201" y="153" width="18" height="3.2" rx="0.5" />
    <rect x="201" y="159" width="18" height="3.2" rx="0.5" />
    <!-- R -->
    <text x="233" y="165" font-family="Cinzel, serif" font-size="24" font-weight="700">R</text>
    <!-- T -->
    <text x="268" y="165" font-family="Cinzel, serif" font-size="24" font-weight="700">T</text>
    <!-- I -->
    <text x="301" y="165" font-family="Cinzel, serif" font-size="24" font-weight="700">I</text>
    <!-- E styled as 3 bars -->
    <rect x="325" y="147" width="18" height="3.2" rx="0.5" />
    <rect x="325" y="153" width="18" height="3.2" rx="0.5" />
    <rect x="325" y="159" width="18" height="3.2" rx="0.5" />
    <!-- S -->
    <text x="357" y="165" font-family="Cinzel, serif" font-size="24" font-weight="700">S</text>
  </g>

  <!-- Lower Divider Line -->
  <line x1="64" y1="178" x2="376" y2="178" stroke="#0a0f1d" stroke-width="1.8" stroke-linecap="square" />

  <!-- Centered Red Triangle Marker -->
  <polygon points="220,180 213,191 227,191" fill="#dc2626" />
</svg>
