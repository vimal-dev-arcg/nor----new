<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Upward Trend Area Gradient -->
    <linearGradient id="trendAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#B3975B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#090D1A" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soaring Trend Line Gradient -->
    <linearGradient id="trendLineGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="35%" stop-color="#B3975B" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Candlestick Green Gradient -->
    <linearGradient id="candleGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Radial Glow in Top Right -->
  <circle cx="500" cy="140" r="220" fill="#10B981" opacity="0.12" filter="url(#glow)" />
  <circle cx="280" cy="320" r="180" fill="#B3975B" opacity="0.08" filter="url(#glow)" />

  <!-- Technical Grid System -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4,6">
    <line x1="50" y1="120" x2="550" y2="120" />
    <line x1="50" y1="200" x2="550" y2="200" />
    <line x1="50" y1="280" x2="550" y2="280" />
    <line x1="50" y1="360" x2="550" y2="360" />
    <line x1="50" y1="440" x2="550" y2="440" />

    <line x1="120" y1="80" x2="120" y2="480" />
    <line x1="220" y1="80" x2="220" y2="480" />
    <line x1="320" y1="80" x2="320" y2="480" />
    <line x1="420" y1="80" x2="420" y2="480" />
    <line x1="520" y1="80" x2="520" y2="480" />
  </g>

  <!-- Solid Baseline -->
  <line x1="50" y1="480" x2="550" y2="480" stroke="#475569" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Bullish Candlesticks in Background -->
  <g opacity="0.4">
    <line x1="120" y1="420" x2="120" y2="465" stroke="#10B981" stroke-width="2" />
    <rect x="112" y="430" width="16" height="25" rx="2" fill="url(#candleGreen)" />

    <line x1="170" y1="380" x2="170" y2="435" stroke="#10B981" stroke-width="2" />
    <rect x="162" y="390" width="16" height="32" rx="2" fill="url(#candleGreen)" />

    <line x1="220" y1="340" x2="220" y2="405" stroke="#10B981" stroke-width="2" />
    <rect x="212" y="350" width="16" height="40" rx="2" fill="url(#candleGreen)" />

    <line x1="270" y1="310" x2="270" y2="375" stroke="#10B981" stroke-width="2" />
    <rect x="262" y="320" width="16" height="38" rx="2" fill="url(#candleGreen)" />

    <line x1="320" y1="260" x2="320" y2="335" stroke="#10B981" stroke-width="2" />
    <rect x="312" y="270" width="16" height="48" rx="2" fill="url(#candleGreen)" />

    <line x1="370" y1="210" x2="370" y2="285" stroke="#10B981" stroke-width="2" />
    <rect x="362" y="220" width="16" height="52" rx="2" fill="url(#candleGreen)" />

    <line x1="420" y1="160" x2="420" y2="245" stroke="#10B981" stroke-width="2" />
    <rect x="412" y="170" width="16" height="58" rx="2" fill="url(#candleGreen)" />

    <line x1="470" y1="110" x2="470" y2="200" stroke="#10B981" stroke-width="2" />
    <rect x="462" y="120" width="16" height="65" rx="2" fill="url(#candleGreen)" />

    <line x1="520" y1="70" x2="520" y2="160" stroke="#10B981" stroke-width="2" />
    <rect x="512" y="80" width="16" height="68" rx="2" fill="url(#candleGreen)" />
  </g>

  <!-- Steep Upward Area Path -->
  <path d="M 50 480 
           L 50 455 
           Q 120 440, 180 415 
           T 290 330 
           T 390 230 
           T 470 145 
           T 550 85 
           L 550 480 Z" 
        fill="url(#trendAreaGrad)" />

  <!-- Dramatic Soaring Upward Trend Line (Glowing) -->
  <path d="M 50 455 
           Q 120 440, 180 415 
           T 290 330 
           T 390 230 
           T 470 145 
           T 550 85" 
        fill="none" 
        stroke="url(#trendLineGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round"
        filter="url(#softGlow)" />

  <!-- Prominent Data Nodes on the Trend Line -->
  <circle cx="180" cy="415" r="5.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="290" cy="330" r="5.5" fill="#B3975B" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="390" cy="230" r="6.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="470" cy="145" r="7.5" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
  
  <!-- Final Soaring Apex Node with Pulse Effect -->
  <circle cx="550" cy="85" r="18" fill="#10B981" opacity="0.3" filter="url(#glow)" />
  <circle cx="550" cy="85" r="9" fill="#34D399" stroke="#FFFFFF" stroke-width="3.5" />

  <!-- Floating Performance Card (Top Left) -->
  <g transform="translate(60, 60)">
    <rect width="180" height="76" rx="14" fill="#0B132B" fill-opacity="0.88" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    
    <circle cx="28" cy="32" r="14" fill="#064E3B" />
    <path d="M 23 37 L 33 27 M 26 27 L 33 27 L 33 34" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <text x="50" y="30" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">DUBAI MARKET</text>
    <text x="50" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">+48.6% ROI</text>
    <text x="28" y="66" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">↗ Steep Capital Growth</text>
  </g>

  <!-- Right Floating Value Tag -->
  <g transform="translate(390, 80)">
    <rect width="125" height="38" rx="10" fill="#064E3B" fill-opacity="0.9" stroke="#34D399" stroke-width="1" />
    <text x="12" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">AED 5.85M</text>
    <text x="92" y="24" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">▲ +32%</text>
  </g>

  <!-- Horizontal Timeline Labels -->
  <g fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
    <text x="50" y="515" text-anchor="middle">2021</text>
    <text x="150" y="515" text-anchor="middle">2022</text>
    <text x="250" y="515" text-anchor="middle">2023</text>
    <text x="350" y="515" text-anchor="middle">2024</text>
    <text x="450" y="515" text-anchor="middle">2025</text>
    <text x="550" y="515" text-anchor="middle" fill="#34D399" font-weight="700">2026 ↗</text>
  </g>
</svg>
