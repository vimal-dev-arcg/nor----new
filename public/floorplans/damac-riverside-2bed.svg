<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8" />
        </pattern>
        <linearGradient id="terraceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ecfeff" />
          <stop offset="100%" stop-color="#cffafe" />
        </linearGradient>
      </defs>

      <!-- Background Grid Blueprint -->
      <rect width="100%" height="100%" fill="#ffffff" />
      <rect width="100%" height="100%" fill="url(#grid)" />

      <!-- Outer Boundary Walls (Double Line Architectural Style) -->
      <rect x="50" y="90" width="700" height="440" fill="none" stroke="#334155" stroke-width="4" />
      <rect x="54" y="94" width="692" height="432" fill="none" stroke="#64748b" stroke-width="1.5" />

      <!-- Balcony / Terrace Zone -->
      <rect x="520" y="100" width="220" height="420" fill="url(#terraceGrad)" stroke="#0891b2" stroke-width="2" stroke-dasharray="6,4" />
      <text x="630" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0e7490" text-anchor="middle">OUTDOOR TERRACE &amp; POOL</text>
      <text x="630" y="305" font-family="monospace" font-size="12" fill="#155e75" text-anchor="middle">185 SQ FT</text>
      
      <!-- Private Pool Graphic in Terrace -->
      <rect x="545" y="340" width="170" height="140" rx="16" fill="#38bdf8" fill-opacity="0.35" stroke="#0284c7" stroke-width="2.5" />
      <text x="630" y="415" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">PRIVATE HORIZON POOL</text>

      <!-- Internal Rooms Layout -->
      
        <!-- Spacious Living Salon -->
        <g>
          <rect x="80" y="120" width="210" height="180" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
          <!-- Room interior hatch/pattern -->
          <line x1="80" y1="140" x2="290" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3" />
          <text x="185.0" y="205.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Spacious Living Salon</text>
          <text x="185.0" y="225.0" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">6.8m x 4.8m</text>
          <!-- Door swing arc -->
          <path d="M 95,120 A 25 25 0 0 1 120,145" fill="none" stroke="#94a3b8" stroke-width="1.5" />
          <line x1="95" y1="120" x2="95" y2="145" stroke="#1e293b" stroke-width="2" />
        </g>
        
        <!-- Modern Island Kitchen -->
        <g>
          <rect x="270" y="120" width="180" height="180" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
          <!-- Room interior hatch/pattern -->
          <line x1="270" y1="140" x2="450" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3" />
          <text x="360.0" y="205.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Modern Island Kitchen</text>
          <text x="360.0" y="225.0" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">4.0m x 3.2m</text>
          <!-- Door swing arc -->
          <path d="M 285,120 A 25 25 0 0 1 310,145" fill="none" stroke="#94a3b8" stroke-width="1.5" />
          <line x1="285" y1="120" x2="285" y2="145" stroke="#1e293b" stroke-width="2" />
        </g>
        
        <!-- Master Bedroom Suite -->
        <g>
          <rect x="460" y="120" width="210" height="190" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
          <!-- Room interior hatch/pattern -->
          <line x1="460" y1="140" x2="670" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3" />
          <text x="565.0" y="210.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Master Bedroom Suite</text>
          <text x="565.0" y="230.0" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">5.2m x 4.0m</text>
          <!-- Door swing arc -->
          <path d="M 475,120 A 25 25 0 0 1 500,145" fill="none" stroke="#94a3b8" stroke-width="1.5" />
          <line x1="475" y1="120" x2="475" y2="145" stroke="#1e293b" stroke-width="2" />
        </g>
        
        <!-- Second Bedroom & Baths -->
        <g>
          <rect x="80" y="270" width="180" height="190" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
          <!-- Room interior hatch/pattern -->
          <line x1="80" y1="290" x2="260" y2="290" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3" />
          <text x="170.0" y="360.0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Second Bedroom & Baths</text>
          <text x="170.0" y="380.0" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">4.4m x 3.6m</text>
          <!-- Door swing arc -->
          <path d="M 95,270 A 25 25 0 0 1 120,295" fill="none" stroke="#94a3b8" stroke-width="1.5" />
          <line x1="95" y1="270" x2="95" y2="295" stroke="#1e293b" stroke-width="2" />
        </g>
        

      <!-- North Arrow & Scale Indicator -->
      <g transform="translate(70, 40)">
        <circle cx="20" cy="20" r="16" fill="none" stroke="#64748b" stroke-width="1.5" />
        <polygon points="20,6 14,24 20,20 26,24" fill="#0f172a" />
        <polygon points="20,34 14,20 20,24 26,20" fill="#cbd5e1" />
        <text x="20" y="4" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">N</text>
      </g>

      <!-- Architectural Header Block -->
      <g transform="translate(130, 30)">
        <text x="0" y="16" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Damac Riverside Views</text>
        <text x="0" y="34" font-family="sans-serif" font-size="12" font-weight="600" fill="#b3975b">DAMAC Properties • 2-Bedroom Lagoon View Suite</text>
      </g>

      <!-- Technical Spec Box (Footer Title Block) -->
      <rect x="50" y="545" width="700" height="55" fill="#0f172a" rx="8" />
      <g fill="#ffffff" transform="translate(70, 568)">
        <text x="0" y="0" font-family="sans-serif" font-size="11" fill="#94a3b8">BEDROOMS</text>
        <text x="0" y="18" font-family="sans-serif" font-size="14" font-weight="bold">2 Beds + 2.5 Baths</text>

        <text x="130" y="0" font-family="sans-serif" font-size="11" fill="#94a3b8">SUITE AREA</text>
        <text x="130" y="18" font-family="sans-serif" font-size="14" font-weight="bold">1,060 SQ FT</text>

        <text x="260" y="0" font-family="sans-serif" font-size="11" fill="#94a3b8">TERRACE</text>
        <text x="260" y="18" font-family="sans-serif" font-size="14" font-weight="bold">185 SQ FT</text>

        <text x="380" y="0" font-family="sans-serif" font-size="11" fill="#94a3b8">TOTAL AREA</text>
        <text x="380" y="18" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">1,245 SQ FT</text>

        <text x="520" y="0" font-family="sans-serif" font-size="11" fill="#eab308">STARTING PRICE</text>
        <text x="520" y="18" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fef08a">AED 1,420,000</text>
      </g>
    </svg>