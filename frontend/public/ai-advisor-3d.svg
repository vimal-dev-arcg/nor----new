<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <!-- Isometric Grid Shadow -->
    <filter id="isoShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#05101a" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#dfbb73" flood-opacity="0.35" />
    </filter>

    <!-- Metallic Gold Isometric Gradients -->
    <linearGradient id="goldTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecd599" />
      <stop offset="50%" stop-color="#fff8e7" />
      <stop offset="100%" stop-color="#dfbb73" />
    </linearGradient>

    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b3975b" />
      <stop offset="100%" stop-color="#7e632b" />
    </linearGradient>

    <linearGradient id="goldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9aa69" />
      <stop offset="100%" stop-color="#917538" />
    </linearGradient>

    <!-- Obsidian Isometric Base Gradients -->
    <linearGradient id="obsidianTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232838" />
      <stop offset="100%" stop-color="#343c54" />
    </linearGradient>

    <linearGradient id="obsidianLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0c14" />
    </linearGradient>

    <linearGradient id="obsidianRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2030" />
      <stop offset="100%" stop-color="#0d101a" />
    </linearGradient>

    <!-- Cyber Cyan Data Stream Glow -->
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="bloomFx" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#isoShadow)">
    <!-- 1. Isometric Hexagonal Plinth / Foundation (Obsidian Slate) -->
    <!-- Top Face: (70, 78) - (116, 102) - (70, 126) - (24, 102) -->
    <polygon points="70,78 116,102 70,126 24,102" fill="url(#obsidianTop)" stroke="#b3975b" stroke-width="1.2" stroke-opacity="0.6" />
    <!-- Left Face: (24, 102) - (70, 126) - (70, 134) - (24, 110) -->
    <polygon points="24,102 70,126 70,134 24,110" fill="url(#obsidianLeft)" />
    <!-- Right Face: (70, 126) - (116, 102) - (116, 110) - (70, 134) -->
    <polygon points="70,126 116,102 116,110 70,134" fill="url(#obsidianRight)" />

    <!-- Isometric Circuit Grid Lines on Foundation -->
    <line x1="47" y1="90" x2="93" y2="114" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
    <line x1="93" y1="90" x2="47" y2="114" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
    <circle cx="70" cy="102" r="2.5" fill="#38bdf8" filter="url(#bloomFx)" />

    <!-- 2. Isometric Architectural Skyscraper / AI Core Tower (Left Tier) -->
    <!-- Top Face -->
    <polygon points="44,52 62,61 44,70 26,61" fill="url(#goldTop)" stroke="#fff" stroke-width="0.5" />
    <!-- Left Face -->
    <polygon points="26,61 44,70 44,98 26,89" fill="url(#goldLeft)" />
    <!-- Right Face -->
    <polygon points="44,70 62,61 62,89 44,98" fill="url(#goldRight)" />

    <!-- 3. Isometric Architectural Skyscraper / AI Core Tower (Right Tier) -->
    <!-- Top Face -->
    <polygon points="96,52 114,61 96,70 78,61" fill="url(#goldTop)" stroke="#fff" stroke-width="0.5" />
    <!-- Left Face -->
    <polygon points="78,61 96,70 96,98 78,89" fill="url(#goldLeft)" />
    <!-- Right Face -->
    <polygon points="96,70 114,61 114,89 96,98" fill="url(#goldRight)" />

    <!-- 4. Central Towering Isometric AI Core Monolith -->
    <!-- Top Face (Highest elevation) -->
    <polygon points="70,18 94,31 70,44 46,31" fill="url(#goldTop)" stroke="#ffffff" stroke-width="0.8" />
    <!-- Left Face -->
    <polygon points="46,31 70,44 70,88 46,75" fill="url(#goldLeft)" />
    <!-- Right Face -->
    <polygon points="70,44 94,31 94,75 70,88" fill="url(#goldRight)" />

    <!-- Central Neural Glass Slits (Data Windows) -->
    <line x1="58" y1="42" x2="58" y2="76" stroke="#38bdf8" stroke-width="2" opacity="0.9" filter="url(#bloomFx)" />
    <line x1="82" y1="42" x2="82" y2="76" stroke="#fff8e7" stroke-width="2" opacity="0.9" filter="url(#bloomFx)" />

    <!-- 5. Floating Isometric Holographic Real Estate Crown (Roof Prism) -->
    <!-- Upward floating golden apex diamond -->
    <g filter="url(#bloomFx)">
      <polygon points="70,4 82,11 70,18 58,11" fill="#fff" opacity="0.9" />
      <polygon points="58,11 70,18 70,22 58,15" fill="#dfbb73" />
      <polygon points="70,18 82,11 82,15 70,22" fill="#b3975b" />
    </g>
  </g>

  <!-- Holographic Orbital Rings around Central Tower -->
  <ellipse cx="70" cy="56" rx="34" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.8" />
  <circle cx="36" cy="56" r="2.2" fill="#38bdf8" filter="url(#bloomFx)" />
  <circle cx="104" cy="56" r="2.2" fill="#dfbb73" filter="url(#bloomFx)" />
</svg>
