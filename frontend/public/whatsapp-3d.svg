<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <!-- Realistic Luxury Drop Shadow with Gold/Emerald Dispersion -->
    <filter id="waLuxuryShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#022c22" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b3975b" flood-opacity="0.35" />
    </filter>

    <!-- Luxury Gold Beveled Outer Ring -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d0" />
      <stop offset="30%" stop-color="#dfbb73" />
      <stop offset="60%" stop-color="#b3975b" />
      <stop offset="90%" stop-color="#7e632b" />
      <stop offset="100%" stop-color="#e8cf96" />
    </linearGradient>

    <!-- 3D Emerald Pearl Sphere Gradient -->
    <radialGradient id="emeraldOrb" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="65%" stop-color="#059669" />
      <stop offset="90%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- 3D Glass Specular Reflection Highlight -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Pure Ivory Bubble with 3D Bevel -->
    <linearGradient id="ivoryBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="bloomSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#waLuxuryShadow)">
    <!-- 1. Gold Metallic Outer Ring Framing (Matches NCR Properties Brand) -->
    <circle cx="70" cy="70" r="56" fill="url(#goldRim)" />
    <!-- 2. Inner Bevel Dark Inset -->
    <circle cx="70" cy="70" r="52.5" fill="#04271f" />
    <!-- 3. 3D Emerald Sphere Core -->
    <circle cx="70" cy="70" r="50" fill="url(#emeraldOrb)" />
  </g>

  <!-- Inner Ambient Gold Line for Luxury Craftsmanship -->
  <circle cx="70" cy="70" r="48" fill="none" stroke="url(#goldRim)" stroke-width="1.2" opacity="0.6" />

  <!-- 3D WhatsApp Conversation Bubble -->
  <g filter="url(#bloomSoft)">
    <!-- Deep Drop Shadow under Bubble -->
    <path d="M70,38 C52.4,38 38,52.4 38,70 C38,76.4 39.9,82.4 43.2,87.4 L40,100 L53,96.6 C58.1,99.3 63.8,101 70,101 C87.6,101 102,86.6 102,70 C102,52.4 87.6,38 70,38 Z" fill="#022c22" opacity="0.45" transform="translate(0, 3)" />
    
    <!-- Bubble Body with Ivory Gradient -->
    <path d="M70,38 C52.4,38 38,52.4 38,70 C38,76.4 39.9,82.4 43.2,87.4 L40,100 L53,96.6 C58.1,99.3 63.8,101 70,101 C87.6,101 102,86.6 102,70 C102,52.4 87.6,38 70,38 Z" fill="url(#ivoryBubble)" stroke="#fdfbf7" stroke-width="0.8" />

    <!-- 3D WhatsApp Phone Icon (Rich Forest/Emerald Green) -->
    <path d="M60.5,54.5 C59.6,52.6 57.7,52.6 56.6,52.6 C55.6,52.6 54.4,53 53.4,54.1 C52.3,55.2 49.3,57.9 49.3,63.5 C49.3,69.1 53.5,74.5 54,75.3 C54.6,76.1 61.9,87.9 73.5,92.4 C83.2,96.2 85.2,94.5 87.4,94.3 C89.5,94.1 94.2,91.5 95.2,88.7 C96.2,85.8 96.2,83.4 95.9,82.9 C95.6,82.3 94.7,82 93.2,81.3 C91.7,80.6 84.8,77.2 83.5,76.8 C82.2,76.2 81.3,76 80.3,77.5 C79.3,78.9 76.6,82.3 75.7,83.2 C74.9,84.1 74,84.2 72.5,83.5 C71,82.8 65,80.8 58.9,75.4 C54.2,71.2 51,66 50.1,64.5 C49.2,63.1 50,62.3 50.8,61.5 C51.4,60.8 52.2,59.8 52.9,58.9 C53.6,58 53.9,57.3 54.4,56.4 C54.9,55.5 54.6,54.7 54.3,54 C53.9,53.2 51.5,47.6 50.5,45.2 Z" fill="#047857" transform="translate(7, 4) scale(0.9)" />
  </g>

  <!-- 3D Curved Dome Reflection Overlay -->
  <path d="M26,54 A44,44 0 0,1 114,54 A48,38 0 0,0 26,54 Z" fill="url(#glassSheen)" />

  <!-- Top Specular Highlight Spot -->
  <circle cx="56" cy="30" r="9" fill="#ffffff" opacity="0.4" filter="url(#bloomSoft)" />
</svg>
