<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%">
  <defs>
    <style>
      .logo-text { font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif; }
      .letter-sub { font-family: 'Cinzel', 'Trajan Pro', 'Cinzel Decorative', serif; font-size: 25px; font-weight: 700; fill: #0a0f1d; }
    </style>
  </defs>

  <!-- Monogram NCR -->
  <g fill="#0a0f1d">
    <!-- Left vertical stem of N -->
    <path d="M 74,32 L 96,32 L 96,120 L 74,120 Z M 64,32 L 106,32 L 106,36 L 64,36 Z M 66,116 L 104,116 L 104,120 L 66,120 Z" />
    <!-- Diagonal of N -->
    <polygon points="92,32 99,32 163,118 152,118" />

    <!-- Classical Fluted Column (Right stem of N) -->
    <!-- Capital Top -->
    <rect x="150" y="26" width="30" height="4" rx="1" />
    <path d="M 152,30 Q 165,33 178,30 L 176,37 L 154,37 Z" />
    <rect x="153" y="36" width="24" height="2.5" />
    <!-- Fluted Shaft -->
    <rect x="155" y="38" width="20" height="72" />
    <!-- Flute grooves (White highlights on black column) -->
    <line x1="158" y1="39" x2="158" y2="109" stroke="#ffffff" stroke-width="1.5" />
    <line x1="162" y1="39" x2="162" y2="109" stroke="#ffffff" stroke-width="1.5" />
    <line x1="165" y1="39" x2="165" y2="109" stroke="#ffffff" stroke-width="1.5" />
    <line x1="168" y1="39" x2="168" y2="109" stroke="#ffffff" stroke-width="1.5" />
    <line x1="172" y1="39" x2="172" y2="109" stroke="#ffffff" stroke-width="1.5" />
    <!-- Base -->
    <rect x="153" y="110" width="24" height="3" />
    <path d="M 152,113 Q 165,115 178,113 L 179,117 L 151,117 Z" />
    <rect x="149" y="117" width="32" height="4" rx="1" />

    <!-- Letter C -->
    <path d="M 242,42 C 233,33 220,28 204,28 C 176,28 155,50 155,78 C 155,106 176,128 205,128 C 221,128 234,122 243,113 L 235,105 C 227,112 217,117 205,117 C 182,117 167,100 167,78 C 167,56 182,39 204,39 C 217,39 227,43 234,51 Z" />

    <!-- Letter R -->
    <!-- Stem of R -->
    <path d="M 256,32 L 275,32 L 275,120 L 256,120 Z M 248,32 L 283,32 L 283,36 L 248,36 Z M 250,116 L 281,116 L 281,120 L 250,120 Z" />
    <!-- Upper loop of R -->
    <path d="M 275,32 L 306,32 C 322,32 334,42 334,55 C 334,68 322,78 306,78 L 275,78 Z M 275,41 L 275,69 L 304,69 C 314,69 322,63 322,55 C 322,47 314,41 304,41 Z" />
    <!-- Sweeping leg of R with elegant flourish -->
    <path d="M 293,75 L 311,75 C 321,85 332,103 346,114 C 356,120 371,121 385,121 L 385,116 C 373,116 361,114 353,107 C 339,95 328,79 316,73 L 293,73 Z" />
  </g>

  <!-- Upper Divider Line -->
  <line x1="64" y1="136" x2="386" y2="136" stroke="#0a0f1d" stroke-width="2.2" />

  <!-- Subtitle: P R O P E R T I ≡ S with 3-bars for E -->
  <g fill="#0a0f1d">
    <text x="67" y="163" font-family="'Cinzel', serif" font-size="24" font-weight="700">P</text>
    <text x="98" y="163" font-family="'Cinzel', serif" font-size="24" font-weight="700">R</text>
    <text x="131" y="163" font-family="'Cinzel', serif" font-size="24" font-weight="700">O</text>
    <text x="167" y="163" font-family="'Cinzel', serif" font-size="24" font-weight="700">P</text>
    <!-- E1 stylized as 3 horizontal bars -->
    <rect x="201" y="146" width="18" height="3.2" rx="0.5" />
    <rect x="201" y="152.2" width="18" height="3.2" rx="0.5" />
    <rect x="201" y="158.4" width="18" height="3.2" rx="0.5" />
    <text x="232" y="163" font-family="'Cinzel', serif" font-size="24" font-weight="700">R</text>
    <text x="266" y="163" font-family="'Cinzel', serif" font-size="24" font-weight="700">T</text>
    <text x="300" y="163" font-family="'Cinzel', serif" font-size="24" font-weight="700">I</text>
    <!-- E2 stylized as 3 horizontal bars -->
    <rect x="325" y="146" width="18" height="3.2" rx="0.5" />
    <rect x="325" y="152.2" width="18" height="3.2" rx="0.5" />
    <rect x="325" y="158.4" width="18" height="3.2" rx="0.5" />
    <text x="357" y="163" font-family="'Cinzel', serif" font-size="24" font-weight="700">S</text>
  </g>

  <!-- Lower Divider Line -->
  <line x1="64" y1="176" x2="386" y2="176" stroke="#0a0f1d" stroke-width="1.8" />

  <!-- Centered Red Triangle Marker -->
  <polygon points="225,178 218,189 232,189" fill="#dc2626" />
</svg>